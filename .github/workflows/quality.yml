name: Quality Gate

on:
  push:
    branches:
      - codex/price-list-10x
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Official Excel master tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Official Shopify enrichment cross-check
        run: npm run audit:shopify

      - name: Official Shopify candidate discovery
        run: CI_SHOPIFY_DISCOVERY=1 npx vitest run tests/official-shopify-discovery.spec.ts

      - name: Preview integrity
        run: npm run qa:preview

      - name: Build release candidate
        run: npm run release:candidate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser buyer QA
        run: npm run test:e2e

      - name: Build guarded quote engine browser fixture
        env:
          VITE_HOT_QUOTE_ENGINE_ENABLED: 'true'
          VITE_HOT_QUOTE_API_URL: http://127.0.0.1:4173/mock-quote-api
          VITE_HOT_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build

      - name: Guarded quote engine browser QA
        env:
          QUOTE_ENGINE_BROWSER_QA: '1'
        run: npx playwright test e2e/quote-engine-wizard.spec.ts

      - name: Restore production build after guarded QA
        if: always()
        run: npm run build && npm run qa:preview

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-list-10x-qa-screenshots
          path: qa-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-list-10x-playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified preview build
        uses: actions/upload-artifact@v4
        with:
          name: price-list-10x-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: price-list-10x-release-candidate
          path: release-candidate
          if-no-files-found: error
          retention-days: 7
