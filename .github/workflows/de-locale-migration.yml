name: DE Locale Migration

on:
  push:
    branches:
      - codex/price-list-quote-engine
    paths:
      - '.github/workflows/de-locale-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/price-list-quote-engine

      - name: Apply narrow German locale migration
        shell: python
        run: |
          from pathlib import Path

          preview = Path('src/preview.ts')
          text = preview.read_text()
          old_codes = "({ en: 'en-BE', it: 'it-IT', fr: 'fr-BE', nl: 'nl-BE' } as const)[current]"
          new_codes = "({ en: 'en-BE', it: 'it-IT', fr: 'fr-BE', nl: 'nl-BE', de: 'de-DE' } as const)[current]"
          old_guard = "next !== 'en' && next !== 'it' && next !== 'fr' && next !== 'nl'"
          new_guard = "next !== 'en' && next !== 'it' && next !== 'fr' && next !== 'nl' && next !== 'de'"
          if old_codes not in text:
              raise SystemExit('preview locale code marker not found')
          if old_guard not in text:
              raise SystemExit('preview locale guard marker not found')
          text = text.replace(old_codes, new_codes, 1).replace(old_guard, new_guard, 1)
          preview.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          marker = '          <button type="button" data-locale="nl">NL</button>\n'
          insertion = marker + '          <button type="button" data-locale="de">DE</button>\n'
          if 'data-locale="de"' not in html:
              if marker not in html:
                  raise SystemExit('language switcher marker not found')
              html = html.replace(marker, insertion, 1)
          index.write_text(html)

      - name: Commit migration result
        shell: bash
        run: |
          if git diff --quiet -- src/preview.ts index.html; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'House Of Tartufo Automation'
          git config user.email 'admin@houseoftartufo.com'
          git add src/preview.ts index.html
          git commit -m 'feat(i18n): wire German locale into Price List UI'
          git push origin HEAD:codex/price-list-quote-engine
